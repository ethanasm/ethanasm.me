name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - uses: typst-community/setup-typst@v4
        with:
          # Pinned: the action defaults to "latest", and a Typst upgrade
          # changes line breaking, which silently pushes the resume to a
          # second page and fails the one-page check below.
          typst-version: 0.15.1
      - name: Install resume fonts (Source Sans 3, Roboto, Font Awesome)
        run: |
          mkdir -p /tmp/resume-fonts
          curl -sSL -o /tmp/source-sans.zip https://github.com/adobe-fonts/source-sans/releases/download/3.052R/OTF-source-sans-3.052R.zip
          curl -sSL -o /tmp/roboto.zip https://github.com/googlefonts/roboto-2/releases/download/v2.138/roboto-unhinted.zip
          curl -sSL -o /tmp/font-awesome.zip https://github.com/FortAwesome/Font-Awesome/releases/download/7.1.0/fontawesome-free-7.1.0-desktop.zip
          unzip -q /tmp/source-sans.zip -d /tmp/resume-fonts
          unzip -q /tmp/roboto.zip -d /tmp/resume-fonts
          unzip -q /tmp/font-awesome.zip -d /tmp/resume-fonts
      - name: Compile resume from Typst source
        run: typst compile --font-path /tmp/resume-fonts resume/resume.typ public/Ethan-Smith-Resume.pdf
      - name: Fail if resume exceeds one page
        run: |
          pages=$(python3 -c "import re; print(len(re.findall(rb'/Type\s*/Page[^s]', open('public/Ethan-Smith-Resume.pdf','rb').read())))")
          echo "Resume page count: $pages"
          test "$pages" = "1"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
